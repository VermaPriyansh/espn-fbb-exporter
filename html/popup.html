<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="../css/popup.css">
  </head>
  <body>
    <div class="popup-container">
      <div id="league-name" class="league-name"></div>
      <div id="team-count" class="team-count"></div>

      <div class="button-group">
        <button id="btn-sync" class="btn-primary" disabled>Sync to Optimizer</button>
        <button id="btn-download" class="btn-secondary" disabled>Download Bundle (JSON)</button>
      </div>

      <div class="settings-group">
        <div class="settings-header">
          <label for="target-url" class="settings-label">Default Optimizer URL:</label>
          <span id="save-status" class="save-status"></span>
        </div>
        <div class="settings-row">
          <input type="text" id="target-url" class="settings-input" placeholder="e.g. http://localhost:8080 or https://...">
          <button id="btn-save-url" class="btn-save" title="Save as default Optimizer URL">Save</button>
        </div>
      </div>

      <div id="progress-line" class="progress-line"></div>
      <div id="error-line" class="error-line"></div>
    </div>
    <script src="../js/popup.js"></script>
  </body>
</html>
